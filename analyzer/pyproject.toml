[project]
name = "adpo-analysis-engine"
version = "0.1.0"
description = "Deterministic, evidence-based analysis engine for GitHub Actions CI/CD data (ADPO)"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
files = ["adpo"]
warn_unused_ignores = true
