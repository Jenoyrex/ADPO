# Shared lint/format config for analyzer/, backend/ and research/.
line-length = 120
target-version = "py39"

[lint]
select = ["E", "F", "W", "I", "B"]

[lint.per-file-ignores]
# FastAPI's dependency-injection idiom is `param = Depends(...)` in defaults.
"backend/app/api/**" = ["B008"]
# Autogenerated migration: long lines are SQLAlchemy DDL emitted by Alembic.
"backend/alembic/versions/*" = ["E501"]

[lint.isort]
known-first-party = ["adpo", "app", "tests"]

[format]
exclude = ["*.md"]
